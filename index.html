<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Novelas por Traducir</title>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,500;0,9..144,600;1,9..144,500;1,9..144,600&family=Special+Elite&family=Courier+Prime:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{
  --verde:#1c2e26;
  --verde2:#243b30;
  --kraft:#ece1c8;
  --kraft2:#e0d2ac;
  --tinta:#2b2620;
  --tinta-suave:#6b5f4f;
  --latón:#a9843f;
  --latón-claro:#c9a765;
  --sello-rojo:#a3392c;
  --sello-azul:#2e5359;
  --radius:3px;
  --font-display:'Fraunces',Georgia,serif;
  --font-stamp:'Special Elite',monospace;
  --font-body:'Courier Prime',monospace;
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{
  background:var(--verde);
  background-image:
    radial-gradient(ellipse at 20% -10%, rgba(169,132,63,0.08) 0%, transparent 45%),
    radial-gradient(ellipse at 90% 110%, rgba(169,132,63,0.06) 0%, transparent 50%);
  color:var(--kraft);
  font-family:var(--font-body);
  min-height:100vh;
  padding-bottom:60px;
}

a:focus-visible,button:focus-visible,input:focus-visible{
  outline:2px solid var(--latón-claro);
  outline-offset:2px;
}

header{
  padding:56px 24px 40px;
  text-align:center;
  border-bottom:1px solid rgba(169,132,63,0.25);
  position:relative;
}
.placa{
  display:inline-block;
  padding:18px 40px;
  border:1px solid var(--latón);
  border-radius:2px;
  background:linear-gradient(180deg, rgba(169,132,63,0.12), rgba(169,132,63,0.04));
  position:relative;
}
.placa::before,.placa::after{
  content:'';
  position:absolute;
  width:6px;height:6px;
  border-radius:50%;
  background:var(--latón-claro);
  box-shadow:0 0 3px rgba(0,0,0,0.4) inset;
  top:8px;
}
.placa::before{left:8px}
.placa::after{right:8px}
.eyebrow{
  font-family:var(--font-stamp);
  font-size:11px;
  letter-spacing:0.25em;
  text-transform:uppercase;
  color:var(--latón-claro);
  margin-bottom:8px;
}
h1{
  font-family:var(--font-display);
  font-weight:500;
  font-style:italic;
  font-size:clamp(28px,5vw,44px);
  color:var(--kraft);
  letter-spacing:0.01em;
}
.subtitulo{
  margin-top:14px;
  font-size:13px;
  color:var(--kraft2);
  max-width:480px;
  margin-left:auto;
  margin-right:auto;
  line-height:1.7;
  opacity:0.75;
}

.controles{
  max-width:900px;
  margin:36px auto 0;
  padding:0 24px;
  display:flex;
  flex-wrap:wrap;
  gap:14px;
  align-items:center;
  justify-content:center;
}
.buscador{
  flex:1 1 240px;
  max-width:340px;
  position:relative;
}
.buscador input{
  width:100%;
  background:var(--verde2);
  border:1px solid rgba(169,132,63,0.35);
  color:var(--kraft);
  font-family:var(--font-body);
  font-size:13px;
  padding:11px 14px;
  border-radius:2px;
  letter-spacing:0.02em;
}
.buscador input::placeholder{color:var(--tinta-suave);opacity:0.9}
.tabs{display:flex;gap:6px}
.tab{
  font-family:var(--font-stamp);
  font-size:11px;
  letter-spacing:0.1em;
  text-transform:uppercase;
  color:var(--kraft2);
  background:transparent;
  border:1px solid rgba(169,132,63,0.35);
  padding:10px 16px;
  border-radius:2px;
  cursor:pointer;
  transition:background .15s ease,color .15s ease;
}
.tab:hover{background:rgba(169,132,63,0.1)}
.tab.activo{
  background:var(--latón);
  color:var(--verde);
  border-color:var(--latón);
}
.contador{
  text-align:center;
  font-family:var(--font-stamp);
  font-size:11px;
  letter-spacing:0.1em;
  color:var(--tinta-suave);
  margin-top:16px;
  text-transform:uppercase;
}

.rejilla{
  max-width:1180px;
  margin:36px auto 0;
  padding:0 24px;
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(240px,1fr));
  gap:34px 26px;
}

.ficha{
  background:var(--kraft);
  background-image:repeating-linear-gradient(0deg, rgba(107,95,79,0.035) 0px, transparent 1px, transparent 3px);
  color:var(--tinta);
  border-radius:var(--radius);
  padding:22px 18px 20px;
  position:relative;
  cursor:pointer;
  box-shadow:0 10px 22px rgba(0,0,0,0.28), 0 1px 0 rgba(255,255,255,0.4) inset;
  transition:transform .18s ease, box-shadow .18s ease;
}
.ficha:nth-child(3n){transform:rotate(-0.6deg)}
.ficha:nth-child(3n+1){transform:rotate(0.5deg)}
.ficha:nth-child(3n+2){transform:rotate(-0.2deg)}
.ficha:hover{
  transform:translateY(-4px) rotate(0deg);
  box-shadow:0 18px 30px rgba(0,0,0,0.35);
}
.ficha:focus-visible{transform:translateY(-4px) rotate(0deg)}

.perforacion{
  position:absolute;
  top:10px;left:50%;
  transform:translateX(-50%);
  width:11px;height:11px;
  border-radius:50%;
  background:var(--verde);
  box-shadow:0 1px 2px rgba(0,0,0,0.5) inset, 0 1px 0 rgba(255,255,255,0.15);
}

.portada-wrap{
  margin:16px auto 14px;
  width:78%;
  aspect-ratio:2/3;
  position:relative;
  background:var(--verde2);
}
.portada-wrap img{
  width:100%;height:100%;
  object-fit:cover;
  display:block;
  filter:sepia(0.12) contrast(1.02);
}
.cinta{
  position:absolute;
  top:-9px;left:50%;
  transform:translateX(-50%) rotate(-3deg);
  width:56px;height:20px;
  background:rgba(233,220,184,0.55);
  border:1px solid rgba(169,132,63,0.3);
}

.titulo-libro{
  font-family:var(--font-display);
  font-weight:600;
  font-size:19px;
  line-height:1.25;
  text-align:center;
  margin-bottom:5px;
}
.autora-libro{
  font-family:var(--font-stamp);
  font-size:11px;
  text-align:center;
  color:var(--tinta-suave);
  text-transform:uppercase;
  letter-spacing:0.08em;
  margin-bottom:10px;
}
.meta-libro{
  display:flex;
  justify-content:center;
  gap:14px;
  font-size:11px;
  color:var(--tinta-suave);
  border-top:1px dashed rgba(107,95,79,0.35);
  border-bottom:1px dashed rgba(107,95,79,0.35);
  padding:8px 0;
  margin-bottom:12px;
}

.sello{
  position:absolute;
  font-family:var(--font-stamp);
  font-size:12px;
  letter-spacing:0.14em;
  text-transform:uppercase;
  padding:6px 10px;
  border:2px solid currentColor;
  border-radius:4px;
  mix-blend-mode:multiply;
  opacity:0.82;
  pointer-events:none;
}
.sello::before{
  content:'';
  position:absolute;
  inset:2px;
  border:1px solid currentColor;
  border-radius:2px;
  opacity:0.5;
}
.sello.libre{
  color:var(--sello-azul);
  top:14px;right:10px;
  transform:rotate(9deg);
}
.sello.escogida{
  color:var(--sello-rojo);
  top:14px;right:6px;
  transform:rotate(-11deg);
}
.etiqueta-serie{
  position:absolute;
  top:16px;left:14px;
  font-family:var(--font-stamp);
  font-size:9.5px;
  letter-spacing:0.1em;
  text-transform:uppercase;
  color:var(--latón);
  border:1px solid var(--latón);
  border-radius:2px;
  padding:3px 6px;
  opacity:0.85;
}
.saga-libro{
  text-align:center;
  font-size:10.5px;
  color:var(--tinta-suave);
  font-style:italic;
  margin-top:-6px;
  margin-bottom:10px;
}

.sinopsis-preview{
  font-size:12px;
  line-height:1.6;
  color:var(--tinta);
  opacity:0.85;
  display:-webkit-box;
  -webkit-line-clamp:3;
  -webkit-box-orient:vertical;
  overflow:hidden;
}
.leer-mas{
  display:block;
  text-align:center;
  margin-top:10px;
  font-family:var(--font-stamp);
  font-size:10px;
  letter-spacing:0.12em;
  text-transform:uppercase;
  color:var(--latón);
}

.vacio{
  text-align:center;
  padding:60px 20px;
  color:var(--kraft2);
  font-family:var(--font-stamp);
  font-size:13px;
  letter-spacing:0.05em;
  opacity:0.7;
}

.overlay{
  position:fixed;inset:0;
  background:rgba(10,14,11,0.72);
  display:none;
  align-items:flex-start;
  justify-content:center;
  padding:40px 20px;
  overflow-y:auto;
  z-index:50;
}
.overlay.abierto{display:flex}
.modal{
  background:var(--kraft);
  color:var(--tinta);
  max-width:640px;
  width:100%;
  border-radius:var(--radius);
  padding:34px 30px 30px;
  position:relative;
  box-shadow:0 30px 60px rgba(0,0,0,0.5);
}
.cerrar{
  position:absolute;
  top:14px;right:16px;
  background:none;
  border:none;
  font-family:var(--font-stamp);
  font-size:20px;
  color:var(--tinta-suave);
  cursor:pointer;
  line-height:1;
}
.modal-top{
  display:flex;
  gap:24px;
  margin-bottom:20px;
}
.modal-portada{
  width:130px;
  flex-shrink:0;
  aspect-ratio:2/3;
  overflow:hidden;
  background:var(--verde2);
}
.modal-portada img{width:100%;height:100%;object-fit:cover;filter:sepia(0.12) contrast(1.02)}
.modal-titulo{
  font-family:var(--font-display);
  font-weight:600;
  font-size:26px;
  line-height:1.2;
  margin-bottom:6px;
}
.modal-autora{
  font-family:var(--font-stamp);
  font-size:12px;
  color:var(--tinta-suave);
  text-transform:uppercase;
  letter-spacing:0.08em;
  margin-bottom:10px;
}
.modal-meta{
  font-size:12px;
  color:var(--tinta-suave);
  display:flex;
  gap:16px;
  margin-bottom:12px;
}
.modal-estado{
  display:inline-block;
  font-family:var(--font-stamp);
  font-size:11px;
  letter-spacing:0.1em;
  text-transform:uppercase;
  padding:5px 10px;
  border-radius:2px;
}
.modal-estado.libre{background:rgba(46,83,89,0.14);color:var(--sello-azul)}
.modal-estado.escogida{background:rgba(163,57,44,0.14);color:var(--sello-rojo)}
.modal-sinopsis{
  font-size:13px;
  line-height:1.75;
  white-space:pre-line;
  border-top:1px dashed rgba(107,95,79,0.35);
  padding-top:18px;
}

@media (max-width:480px){
  .modal-top{flex-direction:column;align-items:center;text-align:center}
  .modal-portada{width:120px}
  .modal-meta{justify-content:center}
}

@media (prefers-reduced-motion:reduce){
  *{transition:none !important}
}
</style>
</head>
<body>

<header>
  <div class="placa">
    <div class="eyebrow">Catálogo de fichas · coordinación de traducciones</div>
    <h1>Novelas por Traducir</h1>
  </div>
  <p class="subtitulo">Las novelas pendientes de traducir. Cada ficha dice si está libre o si alguien ya la ha escogido, para no duplicar el trabajo.</p>
</header>

<div class="controles">
  <div class="buscador">
    <input type="text" id="buscar" placeholder="Buscar por título o autora…">
  </div>
  <div class="tabs">
    <button class="tab activo" data-filtro="todos">Todas</button>
    <button class="tab" data-filtro="libre">Libres</button>
    <button class="tab" data-filtro="escogida">Escogidas</button>
  </div>
</div>
<p class="contador" id="contador"></p>

<div class="rejilla" id="rejilla"></div>

<div class="overlay" id="overlay">
  <div class="modal" id="modal"></div>
</div>

<script src="books-data.js"></script>
<script>
let filtroActivo = 'todos';
let textoBusqueda = '';

const rejilla = document.getElementById('rejilla');
const contador = document.getElementById('contador');
const overlay = document.getElementById('overlay');
const modal = document.getElementById('modal');

function coincideBusqueda(libro, texto){
  if(!texto) return true;
  const t = texto.toLowerCase();
  return libro.titulo.toLowerCase().includes(t) || libro.autora.toLowerCase().includes(t);
}

function render(){
  const filtrados = LIBROS.filter(libro=>{
    if(filtroActivo === 'libre' && libro.escogida) return false;
    if(filtroActivo === 'escogida' && !libro.escogida) return false;
    return coincideBusqueda(libro, textoBusqueda);
  });

  contador.textContent = filtrados.length === 0
    ? ''
    : `${filtrados.length} novela${filtrados.length===1?'':'s'}`;

  if(filtrados.length === 0){
    rejilla.innerHTML = `<div class="vacio">No hay novelas que coincidan con la búsqueda.</div>`;
    return;
  }

  rejilla.innerHTML = filtrados.map((libro)=>`
    <article class="ficha" tabindex="0" data-idx="${LIBROS.indexOf(libro)}">
      <div class="perforacion"></div>
      <div class="sello ${libro.escogida?'escogida':'libre'}">${libro.escogida?'Escogida':'Libre'}</div>
      ${libro.serie ? '<div class="etiqueta-serie">Tiene serie</div>' : ''}
      <div class="portada-wrap">
        <div class="cinta"></div>
        <img src="${libro.portada}" alt="Portada de ${escapeHtml(libro.titulo)}" loading="lazy">
      </div>
      <div class="titulo-libro">${escapeHtml(libro.titulo)}</div>
      <div class="autora-libro">${escapeHtml(libro.autora)}</div>
      ${libro.saga ? `<div class="saga-libro">${escapeHtml(libro.saga)}${libro.sagaNumero ? ' · #' + libro.sagaNumero : ''}</div>` : ''}
      <div class="meta-libro"><span>${libro.anio}</span><span>${libro.paginas} pág.</span></div>
      <p class="sinopsis-preview">${escapeHtml(libro.sinopsis)}</p>
      <span class="leer-mas">Leer ficha completa →</span>
    </article>
  `).join('');

  rejilla.querySelectorAll('.ficha').forEach(el=>{
    el.addEventListener('click', ()=>abrirModal(LIBROS[el.dataset.idx]));
    el.addEventListener('keydown', e=>{
      if(e.key==='Enter' || e.key===' '){ e.preventDefault(); abrirModal(LIBROS[el.dataset.idx]); }
    });
  });
}

function abrirModal(libro){
  modal.innerHTML = `
    <button class="cerrar" aria-label="Cerrar">✕</button>
    <div class="modal-top">
      <div class="modal-portada"><img src="${libro.portada}" alt="Portada de ${escapeHtml(libro.titulo)}"></div>
      <div>
        <div class="modal-titulo">${escapeHtml(libro.titulo)}</div>
        <div class="modal-autora">${escapeHtml(libro.autora)}</div>
        <div class="modal-meta"><span>${libro.anio}</span><span>${libro.paginas} páginas</span>${libro.serie ? '<span>Tiene serie</span>' : ''}</div>
        ${libro.saga ? `<div class="modal-meta" style="margin-top:-6px"><span>Saga: ${escapeHtml(libro.saga)}${libro.sagaNumero ? ' #' + libro.sagaNumero : ''}</span></div>` : ''}
        <span class="modal-estado ${libro.escogida?'escogida':'libre'}">
          ${libro.escogida ? ('Escogida' + (libro.escogidaPor ? ' por ' + escapeHtml(libro.escogidaPor) : '')) : 'Libre para traducir'}
        </span>
      </div>
    </div>
    <div class="modal-sinopsis">${escapeHtml(libro.sinopsis)}</div>
  `;
  modal.querySelector('.cerrar').addEventListener('click', cerrarModal);
  overlay.classList.add('abierto');
  document.addEventListener('keydown', escCierra);
}

function cerrarModal(){
  overlay.classList.remove('abierto');
  document.removeEventListener('keydown', escCierra);
}
function escCierra(e){ if(e.key==='Escape') cerrarModal(); }

overlay.addEventListener('click', e=>{ if(e.target === overlay) cerrarModal(); });

document.querySelectorAll('.tab').forEach(btn=>{
  btn.addEventListener('click', ()=>{
    document.querySelectorAll('.tab').forEach(b=>b.classList.remove('activo'));
    btn.classList.add('activo');
    filtroActivo = btn.dataset.filtro;
    render();
  });
});

document.getElementById('buscar').addEventListener('input', e=>{
  textoBusqueda = e.target.value;
  render();
});

function escapeHtml(str){
  const div = document.createElement('div');
  div.textContent = str ?? '';
  return div.innerHTML;
}

render();
</script>

</body>
</html>
