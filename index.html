<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Novelas por Traducir</title>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,500;0,9..144,600;1,9..144,500;1,9..144,600&family=Special+Elite&family=Courier+Prime:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{
  --verde:#1c2e26;
  --verde2:#243b30;
  --kraft:#ece1c8;
  --kraft2:#e0d2ac;
  --tinta:#2b2620;
  --tinta-suave:#6b5f4f;
  --latón:#a9843f;
  --latón-claro:#c9a765;
  --sello-rojo:#a3392c;
  --sello-azul:#2e5359;
  --radius:3px;
  --font-display:'Fraunces',Georgia,serif;
  --font-stamp:'Special Elite',monospace;
  --font-body:'Courier Prime',monospace;
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{
  background:var(--verde);
  background-image:
    radial-gradient(ellipse at 20% -10%, rgba(169,132,63,0.08) 0%, transparent 45%),
    radial-gradient(ellipse at 90% 110%, rgba(169,132,63,0.06) 0%, transparent 50%);
  color:var(--kraft);
  font-family:var(--font-body);
  min-height:100vh;
  padding-bottom:60px;
}

a:focus-visible,button:focus-visible,input:focus-visible{
  outline:2px solid var(--latón-claro);
  outline-offset:2px;
}

header{
  padding:56px 24px 40px;
  text-align:center;
  border-bottom:1px solid rgba(169,132,63,0.25);
  position:relative;
}
.placa{
  display:inline-block;
  padding:18px 40px;
  border:1px solid var(--latón);
  border-radius:2px;
  background:linear-gradient(180deg, rgba(169,132,63,0.12), rgba(169,132,63,0.04));
  position:relative;
}
.placa::before,.placa::after{
  content:'';
  position:absolute;
  width:6px;height:6px;
  border-radius:50%;
  background:var(--latón-claro);
  box-shadow:0 0 3px rgba(0,0,0,0.4) inset;
  top:8px;
}
.placa::before{left:8px}
.placa::after{right:8px}
.eyebrow{
  font-family:var(--font-stamp);
  font-size:11px;
  letter-spacing:0.25em;
  text-transform:uppercase;
  color:var(--latón-claro);
  margin-bottom:8px;
}
h1{
  font-family:var(--font-display);
  font-weight:500;
  font-style:italic;
  font-size:clamp(28px,5vw,44px);
  color:var(--kraft);
  letter-spacing:0.01em;
}
.subtitulo{
  margin-top:14px;
  font-size:13px;
  color:var(--kraft2);
  max-width:480px;
  margin-left:auto;
  margin-right:auto;
  line-height:1.7;
  opacity:0.75;
}

.controles{
  max-width:900px;
  margin:36px auto 0;
  padding:0 24px;
  display:flex;
  flex-wrap:wrap;
  gap:14px;
  align-items:center;
  justify-content:center;
}
.buscador{
  flex:1 1 240px;
  max-width:340px;
  position:relative;
}
.buscador input{
  width:100%;
  background:var(--verde2);
  border:1px solid rgba(169,132,63,0.35);
  color:var(--kraft);
  font-family:var(--font-body);
  font-size:13px;
  padding:11px 14px;
  border-radius:2px;
  letter-spacing:0.02em;
}
.buscador input::placeholder{color:var(--tinta-suave);opacity:0.9}
.tabs{display:flex;gap:6px}
.tab{
  font-family:var(--font-stamp);
  font-size:11px;
  letter-spacing:0.1em;
  text-transform:uppercase;
  color:var(--kraft2);
  background:transparent;
  border:1px solid rgba(169,132,63,0.35);
  padding:10px 16px;
  border-radius:2px;
  cursor:pointer;
  transition:background .15s ease,color .15s ease;
}
.tab:hover{background:rgba(169,132,63,0.1)}
.tab.activo{
  background:var(--latón);
  color:var(--verde);
  border-color:var(--latón);
}
.contador{
  text-align:center;
  font-family:var(--font-stamp);
  font-size:11px;
  letter-spacing:0.1em;
  color:var(--tinta-suave);
  margin-top:16px;
  text-transform:uppercase;
}

.rejilla{
  max-width:1180px;
  margin:36px auto 0;
  padding:0 24px;
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(240px,1fr));
  gap:34px 26px;
}

.ficha{
  background:var(--kraft);
  background-image:repeating-linear-gradient(0deg, rgba(107,95,79,0.035) 0px, transparent 1px, transparent 3px);
  color:var(--tinta);
  border-radius:var(--radius);
  padding:22px 18px 20px;
  position:relative;
  cursor:pointer;
  box-shadow:0 10px 22px rgba(0,0,0,0.28), 0 1px 0 rgba(255,255,255,0.4) inset;
  transition:transform .18s ease, box-shadow .18s ease;
}
.ficha:nth-child(3n){transform:rotate(-0.6deg)}
.ficha:nth-child(3n+1){transform:rotate(0.5deg)}
.ficha:nth-child(3n+2){transform:rotate(-0.2deg)}
.ficha:hover{
  transform:translateY(-4px) rotate(0deg);
  box-shadow:0 18px 30px rgba(0,0,0,0.35);
}
.ficha:focus-visible{transform:translateY(-4px) rotate(0deg)}

.perforacion{
  position:absolute;
  top:10px;left:50%;
  transform:translateX(-50%);
  width:11px;height:11px;
  border-radius:50%;
  background:var(--verde);
  box-shadow:0 1px 2px rgba(0,0,0,0.5) inset, 0 1px 0 rgba(255,255,255,0.15);
}

.portada-wrap{
  margin:16px auto 14px;
  width:78%;
  aspect-ratio:2/3;
  position:relative;
  background:var(--verde2);
}
.portada-wrap img{
  width:100%;height:100%;
  object-fit:cover;
  display:block;
  filter:sepia(0.12) contrast(1.02);
}
.cinta{
  position:absolute;
  top:-9px;left:50%;
  transform:translateX(-50%) rotate(-3deg);
  width:56px;height:20px;
  background:rgba(233,220,184,0.55);
  border:1px solid rgba(169,132,63,0.3);
}

.titulo-libro{
  font-family:var(--font-display);
  font-weight:600;
  font-size:19px;
  line-height:1.25;
  text-align:center;
  margin-bottom:5px;
}
.autora-libro{
  font-family:var(--font-stamp);
  font-size:11px;
  text-align:center;
  color:var(--tinta-suave);
  text-transform:uppercase;
  letter-spacing:0.08em;
  margin-bottom:10px;
}
.meta-libro{
  display:flex;
  justify-content:center;
  gap:14px;
  font-size:11px;
  color:var(--tinta-suave);
  border-top:1px dashed rgba(107,95,79,0.35);
  border-bottom:1px dashed rgba(107,95,79,0.35);
  padding:8px 0;
  margin-bottom:12px;
}

.sello{
  position:absolute;
  font-family:var(--font-stamp);
  font-size:12px;
  letter-spacing:0.14em;
  text-transform:uppercase;
  padding:6px 10px;
  border:2px solid currentColor;
  border-radius:4px;
  mix-blend-mode:multiply;
  opacity:0.82;
  pointer-events:none;
}
.sello::before{
  content:'';
  position:absolute;
  inset:2px;
  border:1px solid currentColor;
  border-radius:2px;
  opacity:0.5;
}
.sello.libre{
  color:var(--sello-azul);
  top:14px;right:10px;
  transform:rotate(9deg);
}
.sello.escogida{
  color:var(--sello-rojo);
  top:14px;right:6px;
  transform:rotate(-11deg);
}
.etiqueta-serie{
  font-family:var(--font-stamp);
  font-size:9.5px;
  letter-spacing:0.1em;
  text-transform:uppercase;
  color:var(--latón);
  border:1px solid var(--latón);
  border-radius:2px;
  padding:3px 6px;
  opacity:0.85;
  background:rgba(236,225,200,0.6);
}
.etiqueta-nueva{
  font-family:var(--font-stamp);
  font-size:9.5px;
  letter-spacing:0.1em;
  text-transform:uppercase;
  color:var(--kraft);
  background:var(--sello-rojo);
  border:1px solid var(--sello-rojo);
  border-radius:2px;
  padding:3px 6px;
  opacity:0.92;
}
.etiquetas-top{
  position:absolute;
  top:16px;left:14px;
  display:flex;
  flex-direction:column;
  align-items:flex-start;
  gap:6px;
}
.saga-libro{
  text-align:center;
  font-size:10.5px;
  color:var(--tinta-suave);
  font-style:italic;
  margin-top:-6px;
  margin-bottom:10px;
}

.sinopsis-preview{
  font-size:12px;
  line-height:1.6;
  color:var(--tinta);
  opacity:0.85;
  display:-webkit-box;
  -webkit-line-clamp:3;
  -webkit-box-orient:vertical;
  overflow:hidden;
}
.leer-mas{
  display:block;
  text-align:center;
  margin-top:10px;
  font-family:var(--font-stamp);
  font-size:10px;
  letter-spacing:0.12em;
  text-transform:uppercase;
  color:var(--latón);
}

.vacio{
  text-align:center;
  padding:60px 20px;
  color:var(--kraft2);
  font-family:var(--font-stamp);
  font-size:13px;
  letter-spacing:0.05em;
  opacity:0.7;
}

.overlay{
  position:fixed;inset:0;
  background:rgba(10,14,11,0.72);
  display:none;
  align-items:flex-start;
  justify-content:center;
  padding:40px 20px;
  overflow-y:auto;
  z-index:50;
}
.overlay.abierto{display:flex}
.modal{
  background:var(--kraft);
  color:var(--tinta);
  max-width:640px;
  width:100%;
  border-radius:var(--radius);
  padding:34px 30px 30px;
  position:relative;
  box-shadow:0 30px 60px rgba(0,0,0,0.5);
}
.cerrar{
  position:absolute;
  top:14px;right:16px;
  background:none;
  border:none;
  font-family:var(--font-stamp);
  font-size:20px;
  color:var(--tinta-suave);
  cursor:pointer;
  line-height:1;
}
.modal-top{
  display:flex;
  gap:24px;
  margin-bottom:20px;
}
.modal-portada{
  width:130px;
  flex-shrink:0;
  aspect-ratio:2/3;
  overflow:hidden;
  background:var(--verde2);
}
.modal-portada img{width:100%;height:100%;object-fit:cover;filter:sepia(0.12) contrast(1.02)}
.modal-titulo{
  font-family:var(--font-display);
  font-weight:600;
  font-size:26px;
  line-height:1.2;
  margin-bottom:6px;
}
.modal-autora{
  font-family:var(--font-stamp);
  font-size:12px;
  color:var(--tinta-suave);
  text-transform:uppercase;
  letter-spacing:0.08em;
  margin-bottom:10px;
}
.modal-meta{
  font-size:12px;
  color:var(--tinta-suave);
  display:flex;
  gap:16px;
  margin-bottom:12px;
}
.modal-estado{
  display:inline-block;
  font-family:var(--font-stamp);
  font-size:11px;
  letter-spacing:0.1em;
  text-transform:uppercase;
  padding:5px 10px;
  border-radius:2px;
}
.modal-estado.libre{background:rgba(46,83,89,0.14);color:var(--sello-azul)}
.modal-estado.escogida{background:rgba(163,57,44,0.14);color:var(--sello-rojo)}
.modal-sinopsis{
  font-size:13px;
  line-height:1.75;
  white-space:pre-line;
  border-top:1px dashed rgba(107,95,79,0.35);
  padding-top:18px;
}

@media (max-width:480px){
  .modal-top{flex-direction:column;align-items:center;text-align:center}
  .modal-portada{width:120px}
  .modal-meta{justify-content:center}
}

@media (prefers-reduced-motion:reduce){
  *{transition:none !important}
}

/* ---- sesión / auth ---- */
.barra-sesion{
  max-width:900px;
  margin:20px auto 0;
  padding:0 24px;
  display:flex;
  justify-content:center;
  gap:10px;
  font-family:var(--font-stamp);
  font-size:11px;
  letter-spacing:0.06em;
  color:var(--kraft2);
}
.barra-sesion button, .barra-sesion .quien{
  background:transparent;
  border:1px solid rgba(169,132,63,0.4);
  color:var(--kraft2);
  font-family:var(--font-stamp);
  font-size:11px;
  letter-spacing:0.06em;
  padding:7px 14px;
  border-radius:2px;
  cursor:pointer;
  text-transform:uppercase;
}
.barra-sesion button:hover{background:rgba(169,132,63,0.12)}
.barra-sesion .quien{cursor:default;color:var(--latón-claro);border-color:var(--latón)}

.modal-auth{max-width:380px}
.auth-tabs{display:flex;gap:8px;margin-bottom:18px}
.auth-tab{
  flex:1;
  font-family:var(--font-stamp);
  font-size:11px;
  letter-spacing:0.08em;
  text-transform:uppercase;
  padding:9px;
  text-align:center;
  border:1px solid rgba(107,95,79,0.35);
  background:transparent;
  color:var(--tinta-suave);
  cursor:pointer;
  border-radius:2px;
}
.auth-tab.activo{background:var(--verde);color:var(--kraft);border-color:var(--verde)}
.campo{margin-bottom:14px}
.campo label{
  display:block;
  font-family:var(--font-stamp);
  font-size:10.5px;
  letter-spacing:0.06em;
  text-transform:uppercase;
  color:var(--tinta-suave);
  margin-bottom:5px;
}
.campo input, .campo select{
  width:100%;
  padding:10px 12px;
  border:1px solid rgba(107,95,79,0.35);
  border-radius:2px;
  font-family:var(--font-body);
  font-size:13px;
  background:#fff;
  color:var(--tinta);
}
.boton-principal{
  width:100%;
  padding:11px;
  background:var(--verde);
  color:var(--kraft);
  border:none;
  border-radius:2px;
  font-family:var(--font-stamp);
  font-size:12px;
  letter-spacing:0.08em;
  text-transform:uppercase;
  cursor:pointer;
  margin-top:6px;
}
.boton-principal:hover{background:var(--verde2)}
.boton-secundario{
  padding:11px 14px;
  background:transparent;
  color:var(--sello-rojo);
  border:1px solid var(--sello-rojo);
  border-radius:2px;
  font-family:var(--font-stamp);
  font-size:12px;
  letter-spacing:0.08em;
  text-transform:uppercase;
  cursor:pointer;
  margin-top:6px;
}
.boton-secundario:hover{background:rgba(163,57,44,0.08)}
.acciones-progreso .boton-principal{width:auto;flex:1 1 auto}
.auth-error{
  font-size:12px;
  color:var(--sello-rojo);
  margin-top:10px;
  min-height:1em;
}
.auth-ok{font-size:12px;color:var(--sello-azul);margin-top:10px}

/* ---- panel "mi progreso" ---- */
.panel-progreso{
  max-width:640px;
  margin:30px auto 0;
  padding:0 24px;
}
.tarjeta-progreso{
  background:var(--kraft);
  color:var(--tinta);
  border-radius:var(--radius);
  padding:22px;
  box-shadow:0 10px 22px rgba(0,0,0,0.28);
}
.tarjeta-progreso h2{
  font-family:var(--font-display);
  font-weight:600;
  font-size:18px;
  margin-bottom:14px;
}
.fila-progreso{display:flex;gap:12px;flex-wrap:wrap;margin-bottom:14px}
.fila-progreso .campo{flex:1 1 140px;margin-bottom:0}
.barra-porcentaje{
  height:8px;
  background:rgba(107,95,79,0.2);
  border-radius:4px;
  overflow:hidden;
  margin-top:4px;
}
.barra-porcentaje-relleno{
  height:100%;
  background:var(--latón);
}

.etiqueta-estado{
  display:inline-block;
  font-family:var(--font-stamp);
  font-size:10px;
  letter-spacing:0.08em;
  text-transform:uppercase;
  padding:3px 8px;
  border-radius:2px;
  margin-bottom:2px;
}
.etiqueta-estado.libre{background:rgba(46,83,89,0.14);color:var(--sello-azul)}
.etiqueta-estado.traduciendo{background:rgba(169,132,63,0.18);color:var(--latón)}
.etiqueta-estado.revisando{background:rgba(169,132,63,0.28);color:var(--latón)}
.etiqueta-estado.terminada{background:rgba(163,57,44,0.14);color:var(--sello-rojo)}
</style>
</head>
<body>

<header>
  <div class="placa">
    <div class="eyebrow">Catálogo de fichas · coordinación de traducciones</div>
    <h1>Novelas por Traducir</h1>
  </div>
  <p class="subtitulo">Las novelas pendientes de traducir. Cada ficha dice si está libre o si alguien ya la ha escogido, para no duplicar el trabajo.</p>
</header>

<div class="barra-sesion" id="barraSesion"></div>

<div class="panel-progreso" id="panelProgreso" style="display:none"></div>

<div class="controles">
  <div class="buscador">
    <input type="text" id="buscar" placeholder="Buscar por título o autora…">
  </div>
  <div class="tabs">
    <button class="tab activo" data-filtro="todos">Todas</button>
    <button class="tab" data-filtro="libre">Libres</button>
    <button class="tab" data-filtro="escogida">Escogidas</button>
  </div>
</div>
<p class="contador" id="contador"></p>

<div class="rejilla" id="rejilla"></div>

<div class="overlay" id="overlay">
  <div class="modal" id="modal"></div>
</div>

<div class="overlay" id="overlayAuth">
  <div class="modal modal-auth" id="modalAuth"></div>
</div>

<script src="books-data.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
/* ============================================================
   CONFIGURACIÓN DE SUPABASE
   ============================================================ */
const SUPABASE_URL = 'https://eyotgkxdrigknhxueqsx.supabase.co';
const SUPABASE_KEY = 'sb_publishable_z1KYr5Ii8UnF5iib-pisGQ_KxyvVFJk';
const supa = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

let sesionActual = null;      // { user } de Supabase Auth, o null
let progresoPorLibro = {};    // { libro_id: filaDeProgreso }

const ESTADOS = {
  libre:       'Libre',
  traduciendo: 'Traduciendo',
  revisando:   'Revisando',
  terminada:   'Terminada'
};

let filtroActivo = 'todos';
let textoBusqueda = '';

const rejilla = document.getElementById('rejilla');
const contador = document.getElementById('contador');
const overlay = document.getElementById('overlay');
const modal = document.getElementById('modal');

function coincideBusqueda(libro, texto){
  if(!texto) return true;
  const t = texto.toLowerCase();
  return libro.titulo.toLowerCase().includes(t) || libro.autora.toLowerCase().includes(t);
}

/* Combina lo que dice books-data.js con el progreso vivo de Supabase.
   Si una novela tiene fila en Supabase, esa fila manda sobre el "escogida"
   del JSON. Si no tiene fila, se queda como estaba en el JSON (libre). */
function estadoDe(libro){
  const p = progresoPorLibro[libro.id];
  if(p){
    return {
      escogida: p.escogida,
      escogidaPor: p.escogida_por || '',
      estado: p.estado || (p.escogida ? 'traduciendo' : 'libre'),
      progreso_porcentaje: p.progreso_porcentaje,
      capitulo_actual: p.capitulo_actual,
      capitulos_total: p.capitulos_total
    };
  }
  return {
    escogida: !!libro.escogida,
    escogidaPor: libro.escogidaPor || '',
    estado: libro.escogida ? 'traduciendo' : 'libre',
    progreso_porcentaje: null,
    capitulo_actual: null,
    capitulos_total: null
  };
}

// Calcula el % a partir de los capítulos cuando no hay progreso_porcentaje
// guardado directamente (p.ej. si solo se rellenaron capítulos desde index).
function porcentajeDe(info){
  if(info.progreso_porcentaje !== null && info.progreso_porcentaje !== undefined){
    return info.progreso_porcentaje;
  }
  if(info.capitulos_total && info.capitulos_total > 0 && info.capitulo_actual !== null && info.capitulo_actual !== undefined){
    return Math.max(0, Math.min(100, Math.round((info.capitulo_actual / info.capitulos_total) * 100)));
  }
  return null;
}

function chipProgreso(info){
  if(!info.escogida) return '';
  const pct = porcentajeDe(info);
  const extra = pct !== null ? ` · ${pct}%` : '';
  return `<span class="etiqueta-estado ${info.estado}">${ESTADOS[info.estado] || 'Escogida'}${extra}</span>`;
}

function render(){
  const filtrados = LIBROS.filter(libro=>{
    const info = estadoDe(libro);
    if(filtroActivo === 'libre' && info.escogida) return false;
    if(filtroActivo === 'escogida' && !info.escogida) return false;
    return coincideBusqueda(libro, textoBusqueda);
  });

  contador.textContent = filtrados.length === 0
    ? ''
    : `${filtrados.length} novela${filtrados.length===1?'':'s'}`;

  if(filtrados.length === 0){
    rejilla.innerHTML = `<div class="vacio">No hay novelas que coincidan con la búsqueda.</div>`;
    return;
  }

  rejilla.innerHTML = filtrados.map((libro)=>{
    const info = estadoDe(libro);
    return `
    <article class="ficha" tabindex="0" data-idx="${LIBROS.indexOf(libro)}">
      <div class="perforacion"></div>
      <div class="sello ${info.escogida?'escogida':'libre'}">${info.escogida?'Escogida':'Libre'}</div>
      ${(libro.nueva || libro.serie) ? `
      <div class="etiquetas-top">
        ${libro.nueva ? '<span class="etiqueta-nueva">Nueva</span>' : ''}
        ${libro.serie ? '<span class="etiqueta-serie">Tiene serie</span>' : ''}
      </div>` : ''}
      <div class="portada-wrap">
        <div class="cinta"></div>
        <img src="${libro.portada}" alt="Portada de ${escapeHtml(libro.titulo)}" loading="lazy">
      </div>
      <div class="titulo-libro">${escapeHtml(libro.titulo)}</div>
      <div class="autora-libro">${escapeHtml(libro.autora)}</div>
      ${libro.saga ? `<div class="saga-libro">${escapeHtml(libro.saga)}${libro.sagaNumero ? ' · #' + libro.sagaNumero : ''}</div>` : ''}
      <div class="meta-libro"><span>${libro.anio}</span><span>${libro.paginas} pág.</span></div>
      ${chipProgreso(info) ? `<div style="text-align:center;margin-bottom:8px">${chipProgreso(info)}</div>` : ''}
      <p class="sinopsis-preview">${escapeHtml(libro.sinopsis)}</p>
      <span class="leer-mas">Leer ficha completa →</span>
    </article>
  `;}).join('');

  rejilla.querySelectorAll('.ficha').forEach(el=>{
    el.addEventListener('click', ()=>abrirModal(LIBROS[el.dataset.idx]));
    el.addEventListener('keydown', e=>{
      if(e.key==='Enter' || e.key===' '){ e.preventDefault(); abrirModal(LIBROS[el.dataset.idx]); }
    });
  });
}

function abrirModal(libro){
  const info = estadoDe(libro);
  const porcentajeModal = porcentajeDe(info);
  modal.innerHTML = `
    <button class="cerrar" aria-label="Cerrar">✕</button>
    <div class="modal-top">
      <div class="modal-portada"><img src="${libro.portada}" alt="Portada de ${escapeHtml(libro.titulo)}"></div>
      <div>
        <div class="modal-titulo">${escapeHtml(libro.titulo)}</div>
        <div class="modal-autora">${escapeHtml(libro.autora)}</div>
        <div class="modal-meta"><span>${libro.anio}</span><span>${libro.paginas} páginas</span>${libro.serie ? '<span>Tiene serie</span>' : ''}${libro.nueva ? '<span>Nueva</span>' : ''}</div>
        ${libro.saga ? `<div class="modal-meta" style="margin-top:-6px"><span>Saga: ${escapeHtml(libro.saga)}${libro.sagaNumero ? ' #' + libro.sagaNumero : ''}</span></div>` : ''}
        <span class="modal-estado ${info.escogida?'escogida':'libre'}">
          ${info.escogida ? (escapeHtml(ESTADOS[info.estado] || 'Escogida') + (info.escogidaPor ? ' por ' + escapeHtml(info.escogidaPor) : '')) : 'Libre para traducir'}
        </span>
        ${info.escogida && porcentajeModal !== null ? `
          <div class="barra-porcentaje" style="margin-top:10px;max-width:220px">
            <div class="barra-porcentaje-relleno" style="width:${porcentajeModal}%"></div>
          </div>
          <div style="font-size:11px;color:var(--tinta-suave);margin-top:4px">${porcentajeModal}% traducido</div>
        ` : ''}
        ${!info.escogida ? (sesionActual
          ? `<button class="boton-principal" style="margin-top:14px" onclick="elegirLibro('${libro.id}')">Elegir esta novela para traducir</button>`
          : `<button class="boton-principal" style="margin-top:14px" onclick="cerrarModal(); abrirModalAuth('login');">Inicia sesión para elegir esta novela</button>`
        ) : ''}
      </div>
    </div>
    <div class="modal-sinopsis">${escapeHtml(libro.sinopsis)}</div>
  `;
  modal.querySelector('.cerrar').addEventListener('click', cerrarModal);
  overlay.classList.add('abierto');
  document.addEventListener('keydown', escCierra);
}

function cerrarModal(){
  overlay.classList.remove('abierto');
  document.removeEventListener('keydown', escCierra);
}
function escCierra(e){ if(e.key==='Escape') cerrarModal(); }

overlay.addEventListener('click', e=>{ if(e.target === overlay) cerrarModal(); });

document.querySelectorAll('.tab').forEach(btn=>{
  btn.addEventListener('click', ()=>{
    document.querySelectorAll('.tab').forEach(b=>b.classList.remove('activo'));
    btn.classList.add('activo');
    filtroActivo = btn.dataset.filtro;
    render();
  });
});

document.getElementById('buscar').addEventListener('input', e=>{
  textoBusqueda = e.target.value;
  render();
});

function escapeHtml(str){
  const div = document.createElement('div');
  div.textContent = str ?? '';
  return div.innerHTML;
}

/* ============================================================
   PROGRESO (lectura pública desde Supabase)
   ============================================================ */
async function cargarProgreso(){
  const { data, error } = await supa.from('novelas_traducir').select('*');
  if(error){ console.error('Error cargando progreso:', error); return; }
  progresoPorLibro = {};
  (data || []).forEach(fila => { progresoPorLibro[fila.libro_id] = fila; });
}

/* ============================================================
   SESIÓN / AUTENTICACIÓN
   ============================================================ */
const overlayAuth = document.getElementById('overlayAuth');
const modalAuth = document.getElementById('modalAuth');
const barraSesion = document.getElementById('barraSesion');
const panelProgreso = document.getElementById('panelProgreso');

async function cargarSesion(){
  const { data } = await supa.auth.getSession();
  sesionActual = data.session;
}

function renderBarraSesion(){
  if(sesionActual){
    const email = sesionActual.user.email;
    barraSesion.innerHTML = `
      <span class="quien">${escapeHtml(email)}</span>
      <button id="btnCerrarSesion">Cerrar sesión</button>
    `;
    document.getElementById('btnCerrarSesion').addEventListener('click', async ()=>{
      await supa.auth.signOut();
      sesionActual = null;
      renderBarraSesion();
      await renderPanelProgreso();
    });
  } else {
    barraSesion.innerHTML = `<button id="btnAbrirAuth">Iniciar sesión / Registrarme</button>`;
    document.getElementById('btnAbrirAuth').addEventListener('click', ()=>abrirModalAuth());
  }
}

function abrirModalAuth(pestañaInicial='login'){
  renderModalAuth(pestañaInicial);
  overlayAuth.classList.add('abierto');
}
function cerrarModalAuth(){
  overlayAuth.classList.remove('abierto');
}
overlayAuth.addEventListener('click', e=>{ if(e.target === overlayAuth) cerrarModalAuth(); });

function renderModalAuth(pestaña){
  modalAuth.innerHTML = `
    <button class="cerrar" aria-label="Cerrar">✕</button>
    <div class="auth-tabs">
      <button class="auth-tab ${pestaña==='login'?'activo':''}" data-tab="login">Iniciar sesión</button>
      <button class="auth-tab ${pestaña==='registro'?'activo':''}" data-tab="registro">Registrarme</button>
    </div>
    <div id="authContenido"></div>
    <div class="auth-error" id="authError"></div>
  `;
  modalAuth.querySelector('.cerrar').addEventListener('click', cerrarModalAuth);
  modalAuth.querySelectorAll('.auth-tab').forEach(t=>{
    t.addEventListener('click', ()=>renderModalAuth(t.dataset.tab));
  });

  const contenido = document.getElementById('authContenido');
  if(pestaña === 'registro'){
    contenido.innerHTML = `
      <div class="campo"><label>@ de Telegram</label><input id="regTelegram" name="regTelegram" autocomplete="off" placeholder="@tuusuario"></div>
      <div class="campo"><label>Email</label><input id="regEmail" name="regEmail" type="email" autocomplete="new-email" placeholder="tu@email.com"></div>
      <div class="campo"><label>Contraseña</label><input id="regPass" name="regPass" type="password" autocomplete="new-password" placeholder="mínimo 6 caracteres"></div>
      <button class="boton-principal" id="btnRegistrar">Crear cuenta</button>
    `;
    document.getElementById('btnRegistrar').addEventListener('click', registrar);
  } else {
    contenido.innerHTML = `
      <div class="campo"><label>Email</label><input id="loginEmail" name="loginEmail" type="email" autocomplete="username" placeholder="tu@email.com"></div>
      <div class="campo"><label>Contraseña</label><input id="loginPass" name="loginPass" type="password" autocomplete="current-password"></div>
      <button class="boton-principal" id="btnLogin">Entrar</button>
    `;
    document.getElementById('btnLogin').addEventListener('click', iniciarSesion);
  }
}

async function registrar(){
  const telegram = document.getElementById('regTelegram').value.trim();
  const email = document.getElementById('regEmail').value.trim();
  const pass = document.getElementById('regPass').value;
  const errorEl = document.getElementById('authError');
  errorEl.textContent = '';

  if(!telegram || !email || !pass){
    errorEl.textContent = 'Rellena los tres campos, por favor.';
    return;
  }
  if(pass.length < 6){
    errorEl.textContent = 'La contraseña debe tener al menos 6 caracteres.';
    return;
  }

  const { data, error } = await supa.auth.signUp({ email, password: pass });
  if(error){ errorEl.textContent = error.message; return; }

  // Guardamos el perfil (telegram + email) — necesita que la sesión ya esté activa
  if(data.user){
    const { error: errorPerfil } = await supa.from('perfiles').insert({
      id: data.user.id,
      email: email,
      telegram: telegram
    });
    if(errorPerfil){ console.error('Error guardando perfil:', errorPerfil); }
  }

  sesionActual = data.session;
  if(sesionActual){
    cerrarModalAuth();
    renderBarraSesion();
    await renderPanelProgreso();
  } else {
    // Si el proyecto pide confirmar el email antes de iniciar sesión
    errorEl.style.color = 'var(--sello-azul)';
    errorEl.textContent = 'Cuenta creada. Revisa tu correo para confirmarla antes de iniciar sesión.';
  }
}

async function iniciarSesion(){
  const email = document.getElementById('loginEmail').value.trim();
  const pass = document.getElementById('loginPass').value;
  const errorEl = document.getElementById('authError');
  errorEl.textContent = '';

  const { data, error } = await supa.auth.signInWithPassword({ email, password: pass });
  if(error){ errorEl.textContent = 'Email o contraseña incorrectos.'; return; }

  sesionActual = data.session;
  cerrarModalAuth();
  renderBarraSesion();
  await renderPanelProgreso();
}

/* ============================================================
   ELEGIR NOVELA (autoasignación desde la web)
   ============================================================ */
async function elegirLibro(libroId){
  if(!sesionActual){
    cerrarModal();
    abrirModalAuth('login');
    return;
  }
  if(!confirm('¿Quieres elegir esta novela para traducir?')) return;

  const email = sesionActual.user.email;
  let escogidaPor = email;
  const { data: perfil } = await supa.from('perfiles').select('telegram').eq('id', sesionActual.user.id).single();
  if(perfil && perfil.telegram) escogidaPor = perfil.telegram;

  // Volvemos a comprobar en el momento de guardar, por si alguien se
  // adelantó a elegirla mientras tú tenías la ficha abierta.
  const { data: filaActual } = await supa.from('novelas_traducir').select('escogida').eq('libro_id', libroId).maybeSingle();
  if(filaActual && filaActual.escogida){
    alert('Vaya, alguien se te ha adelantado y ya ha elegido esta novela.');
    await cargarProgreso();
    render();
    cerrarModal();
    return;
  }

  const { error } = await supa.from('novelas_traducir').upsert({
    libro_id: libroId,
    escogida: true,
    escogida_por: escogidaPor,
    escogida_por_email: email,
    estado: 'traduciendo'
  }, { onConflict: 'libro_id' });

  if(error){
    alert('No se pudo elegir la novela: ' + error.message);
    return;
  }
  cerrarModal();
  await cargarProgreso();
  render();
  await renderPanelProgreso();
}

/* ============================================================
   PANEL "MI PROGRESO" (solo si la persona logueada tiene una
   novela asignada a su email)
   ============================================================ */
async function renderPanelProgreso(){
  if(!sesionActual){
    panelProgreso.style.display = 'none';
    panelProgreso.innerHTML = '';
    return;
  }

  const miEmail = sesionActual.user.email;
  const { data, error } = await supa
    .from('novelas_traducir')
    .select('*')
    .eq('escogida_por_email', miEmail);

  if(error || !data || data.length === 0){
    panelProgreso.style.display = 'none';
    panelProgreso.innerHTML = '';
    return;
  }

  panelProgreso.style.display = 'block';
  panelProgreso.innerHTML = data.map(fila=>{
    const libro = LIBROS.find(l => l.id === fila.libro_id);
    const titulo = libro ? libro.titulo : fila.libro_id;
    return `
    <div class="tarjeta-progreso" style="margin-bottom:16px">
      <h2>Tu progreso — ${escapeHtml(titulo)}</h2>
      <div class="fila-progreso">
        <div class="campo">
          <label>Estado</label>
          <select data-libro="${fila.libro_id}" class="campo-estado">
            ${Object.entries(ESTADOS).filter(([k])=>k!=='libre').map(([k,v])=>
              `<option value="${k}" ${fila.estado===k?'selected':''}>${v}</option>`
            ).join('')}
          </select>
        </div>
      </div>
      <div class="fila-progreso">
        <div class="campo">
          <label>Capítulo actual</label>
          <input type="number" min="0" data-libro="${fila.libro_id}" class="campo-cap-actual" value="${fila.capitulo_actual ?? ''}" oninput="actualizarPorcentajeCalculado('${fila.libro_id}')">
        </div>
        <div class="campo">
          <label>Capítulos totales</label>
          <input type="number" min="0" data-libro="${fila.libro_id}" class="campo-cap-total" value="${fila.capitulos_total ?? ''}" oninput="actualizarPorcentajeCalculado('${fila.libro_id}')">
        </div>
      </div>
      <div class="campo-porcentaje-calculado" id="porcentajeCalculado-${fila.libro_id}" style="font-size:12px;color:var(--tinta-suave);margin-bottom:12px"></div>
      <div class="acciones-progreso" style="display:flex;gap:10px;flex-wrap:wrap;align-items:center">
        <button class="boton-principal" data-libro="${fila.libro_id}" onclick="guardarProgreso('${fila.libro_id}')">Guardar progreso</button>
        <button class="boton-secundario" data-libro="${fila.libro_id}" onclick="dejarLibroLibre('${fila.libro_id}')">Dejar esta novela libre</button>
      </div>
      <div class="auth-ok" id="guardadoOk-${fila.libro_id}"></div>
    </div>
  `;}).join('');

  // Pintamos el % calculado inicial de cada tarjeta ya renderizada
  data.forEach(fila => actualizarPorcentajeCalculado(fila.libro_id));
}

// El % ya no se escribe a mano: se calcula siempre a partir de los capítulos.
function calcularPorcentaje(capActual, capTotal){
  if(!capTotal || capTotal <= 0 || capActual === null || capActual === undefined) return null;
  const pct = Math.round((capActual / capTotal) * 100);
  return Math.max(0, Math.min(100, pct));
}

function actualizarPorcentajeCalculado(libroId){
  const capActualStr = document.querySelector(`.campo-cap-actual[data-libro="${libroId}"]`).value;
  const capTotalStr = document.querySelector(`.campo-cap-total[data-libro="${libroId}"]`).value;
  const capActual = capActualStr === '' ? null : Number(capActualStr);
  const capTotal = capTotalStr === '' ? null : Number(capTotalStr);
  const pct = calcularPorcentaje(capActual, capTotal);
  const el = document.getElementById('porcentajeCalculado-' + libroId);
  if(!el) return;
  el.textContent = pct === null ? '' : `${pct}% calculado a partir de los capítulos`;
}

async function guardarProgreso(libroId){
  const estado = document.querySelector(`.campo-estado[data-libro="${libroId}"]`).value;
  const capActualStr = document.querySelector(`.campo-cap-actual[data-libro="${libroId}"]`).value;
  const capTotalStr = document.querySelector(`.campo-cap-total[data-libro="${libroId}"]`).value;
  const capActual = capActualStr === '' ? null : Number(capActualStr);
  const capTotal = capTotalStr === '' ? null : Number(capTotalStr);

  const { error } = await supa.from('novelas_traducir').update({
    estado: estado,
    progreso_porcentaje: calcularPorcentaje(capActual, capTotal),
    capitulo_actual: capActual,
    capitulos_total: capTotal
  }).eq('libro_id', libroId);

  const okEl = document.getElementById('guardadoOk-' + libroId);
  if(error){
    okEl.style.color = 'var(--sello-rojo)';
    okEl.textContent = 'No se pudo guardar: ' + error.message;
    return;
  }
  okEl.style.color = 'var(--sello-azul)';
  okEl.textContent = '✓ Guardado';
  await cargarProgreso();
  render();
}

// Deja libre una novela que la propia persona logueada había elegido.
// Va siempre atada a su email (escogida_por_email), así que nunca puede
// tocar la novela de otra persona, aunque conozca el libro_id.
async function dejarLibroLibre(libroId){
  if(!sesionActual) return;
  const libro = LIBROS.find(l => l.id === libroId);
  const titulo = libro ? libro.titulo : libroId;
  if(!confirm(`¿Dejar «${titulo}» libre otra vez? Se borrará tu progreso guardado en esta novela.`)) return;

  const miEmail = sesionActual.user.email;
  const { error } = await supa
    .from('novelas_traducir')
    .delete()
    .eq('libro_id', libroId)
    .eq('escogida_por_email', miEmail);

  if(error){
    alert('No se pudo dejarla libre: ' + error.message);
    return;
  }
  await cargarProgreso();
  render();
  await renderPanelProgreso();
}

/* ============================================================
   ARRANQUE
   ============================================================ */
async function iniciar(){
  await cargarSesion();
  await cargarProgreso();
  renderBarraSesion();
  await renderPanelProgreso();
  render();
}
iniciar();
</script>
